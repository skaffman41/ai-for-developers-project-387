name: opencode-pr-review-report

on:
  workflow_run:
    workflows: [opencode-pr-review]
    types: [completed]

permissions: {}

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Report the stopped review without a model or PR checkout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repository = 'skaffman41/ai-for-developers-project-387';
            const event = context.payload;
            const trigger = event.workflow_run;
            const workflowPath = '.github/workflows/opencode-pr-review.yml';
            if (context.eventName !== 'workflow_run' || event.action !== 'completed' ||
                event.repository?.full_name !== repository || trigger?.event !== 'pull_request' ||
                trigger.name !== 'opencode-pr-review' || trigger.path !== workflowPath ||
                trigger.repository?.full_name !== repository || trigger.head_repository?.full_name !== repository ||
                !Number.isSafeInteger(trigger.id) || !Number.isSafeInteger(trigger.run_attempt)) return;
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...context.repo, workflow_id: 'opencode-pr-review.yml' });
            if (workflow.id !== trigger.workflow_id || workflow.path !== workflowPath || workflow.name !== trigger.name) return;
            const { data: producer } = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: trigger.id, attempt_number: trigger.run_attempt,
            });
            if (producer.id !== trigger.id || producer.run_attempt !== trigger.run_attempt ||
                producer.workflow_id !== workflow.id || producer.path !== workflowPath ||
                producer.event !== 'pull_request' || producer.status !== 'completed' ||
                producer.repository?.full_name !== repository || producer.head_repository?.full_name !== repository ||
                !['failure', 'timed_out', 'cancelled', 'action_required', 'startup_failure'].includes(producer.conclusion)) return;
            const marker = /^opencode-review pr=(\d+) sha=([a-f0-9]{40})$/.exec(producer.display_title);
            if (!marker || trigger.display_title !== producer.display_title) return;
            const number = Number(marker[1]);
            const sha = marker[2];
            if (!Number.isSafeInteger(number) || number <= 0) return;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.head?.sha !== sha ||
                pr.head?.repo?.full_name !== repository || pr.head.repo.fork || pr.base?.repo?.full_name !== repository ||
                !((pr.user?.login === 'skaffman41' && pr.user.type === 'User') ||
                  (pr.user?.login === 'opencode-agent[bot]' && pr.user.type === 'Bot'))) {
              core.notice('Review reporter skipped: untrusted, closed or obsolete PR'); return;
            }
            let reason = producer.conclusion === 'timed_out' ? 'timeout' :
              producer.conclusion === 'cancelled' ? 'agent_failed' : 'infra';
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo, run_id: producer.id, attempt_number: producer.run_attempt, per_page: 100,
              });
              const review = jobs.find(job => job.name === 'Review PR');
              if (review?.conclusion === 'timed_out' || review?.steps?.some(step => step.name === 'Read-only review timed out' && step.conclusion === 'failure')) reason = 'timeout';
              else if (reason !== 'timeout' && review?.steps?.some(step => step.name === 'Run read-only review' && step.conclusion === 'failure')) reason = 'agent_failed';
            } catch { core.notice('Job diagnostics unavailable; using the producer conclusion'); }
            const run = `https://github.com/${repository}/actions/runs/${producer.id}/attempts/${producer.run_attempt}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: number,
              body: `OpenCode review: ${reason}; нужен человек.\n\nПоследний известный SHA: ${sha}\nЗапуск: ${run}\nМодель не вызывается повторно; платный fallback отсутствует.` });
